# Local Journal Agent (Agentic RAG) stack: Postgres+pgvector + FastAPI service
# GateGuard: callers docker compose up. Affected API: host Ollama via OLLAMA_BASE_URL.
# Data schemas: none. User: Implement the plan as specified. Do NOT edit the plan file.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://journal:journal@db:5432/journal
      RETRIEVAL_ENABLED: "true"
      VECTOR_BACKEND: pgvector
      ALLOW_CLOUD_VECTORSTORE: "false"
      EMBEDDING_BACKEND: default
      EMBEDDING_DIMENSION: "384"
      CHUNK_SIZE: "400"
      CHUNK_OVERLAP: "80"
      LLM_BACKEND: ollama
      ALLOW_CLOUD_LLM: "false"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENV: dev
      RAG_NAMESPACE_MODE: fixed
      RAG_NAMESPACE_FIXED: ai-health-journal
      LANGFUSE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
