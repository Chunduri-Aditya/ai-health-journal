# fly.toml — Journal Agent, Agentic RAG Service on Fly.io
# Prerequisites:
#   1. fly auth login
#   2. fly apps create journal-agent   (or rename app below)
#   3. Provision Postgres with pgvector (Neon/Supabase/Fly Postgres) and set secrets
#      — see docs/DEPLOY.md for the full checklist (Groq free OSS or Anthropic paid).
#   4. fly deploy
#
# Free-OSS test profile (default below): Groq via openai_compatible.
# Paid flip: set LLM_BACKEND=anthropic and ANTHROPIC_API_KEY (see docs/DEPLOY.md).

app = "journal-agent"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.service"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/readyz"

[env]
  ENV = "production"
  RETRIEVAL_ENABLED = "true"
  VECTOR_BACKEND = "pgvector"
  EMBEDDING_BACKEND = "openai"
  OPENAI_EMBED_MODEL = "text-embedding-3-small"
  EMBEDDING_DIMENSION = "1536"
  CHUNK_SIZE = "400"
  CHUNK_OVERLAP = "80"
  HNSW_M = "16"
  HNSW_EF_CONSTRUCTION = "64"
  HNSW_EF_SEARCH = "40"
  LLM_BACKEND = "openai_compatible"
  # GateGuard: callers fly deploy. Affected API: Groq role model env defaults.
  # Data schemas: none. User: Groq org limits (8K TPM).
  OPENAI_COMPATIBLE_BASE_URL = "https://api.groq.com/openai/v1"
  OPENAI_COMPATIBLE_GENERATOR_MODEL = "openai/gpt-oss-20b"
  OPENAI_COMPATIBLE_FALLBACK_MODEL = "openai/gpt-oss-120b"
  OPENAI_COMPATIBLE_VERIFIER_MODEL = "openai/gpt-oss-20b"
  OPENAI_COMPATIBLE_PROMPT_MODEL = "openai/gpt-oss-20b"
  LANGFUSE_ENABLED = "false"
  RAG_NAMESPACE_MODE = "fixed"
  RAG_NAMESPACE_FIXED = "ai-health-journal"
